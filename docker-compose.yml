services:
  dev:
    hostname: ${COMPOSE_PROJECT_NAME:-inside-docker}
    build:
      context: ${HOST_REPO_PATH}
      dockerfile: ${PROJECT_DOCKERFILE:-.devcontainer/Dockerfile}
      args:
        BASE_IMAGE: ${EOC_BASE_IMAGE:-eoc-base-container:latest}
        USERNAME: ${CONTAINER_USER:-dev}
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
        OPENCODE_NPM_PACKAGE: ${OPENCODE_NPM_PACKAGE:-opencode-ai}
    image: ${COMPOSE_PROJECT_NAME:-emacs-opencode}-dev:latest
    container_name: ${COMPOSE_PROJECT_NAME:-emacs-opencode}-dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace/${WORKSPACE_DIRNAME}
    tty: true
    stdin_open: true
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: ${PIDS_LIMIT:-512}
    cpus: ${CPU_LIMIT:-4}
    mem_limit: ${MEM_LIMIT:-8g}
    environment:
      TZ: ${TZ:-UTC}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: /home/${CONTAINER_USER:-dev}/.xdg-runtime
      GDK_BACKEND: wayland
      HOST_REPO_PATH: ${HOST_REPO_PATH}
      WORKSPACE_DIRNAME: ${WORKSPACE_DIRNAME}
      OPENCODE_HOME: /workspace/${WORKSPACE_DIRNAME}/.devcontainer/.runtime/opencode-state
      OPENCODE_CONFIG_DIR: /opencode-config
      OPENCODE_AUTH_DIR: /opencode-share
      OPENCODE_STATE_DIR: /workspace/${WORKSPACE_DIRNAME}/.devcontainer/.runtime/opencode-state
      XDG_DATA_HOME: /workspace/${WORKSPACE_DIRNAME}/.devcontainer/.runtime/opencode-state
      XDG_STATE_HOME: /workspace/${WORKSPACE_DIRNAME}/.devcontainer/.runtime/opencode-state
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      NPM_CONFIG_CACHE: /cache/npm
      PNPM_HOME: /cache/pnpm
      PNPM_STORE_PATH: /cache/pnpm-store
      PIP_CACHE_DIR: /cache/pip
    volumes:
      - type: bind
        source: ${HOST_REPO_PATH}
        target: /workspace/${WORKSPACE_DIRNAME}
      # Git worktrees contain a .git file that points back to the primary
      # checkout's common .git directory. Mount that common directory at the
      # same absolute path it has on the host so git works inside containers
      # whose /workspace mount only contains the linked worktree.
      - type: bind
        source: ${HOST_GIT_COMMON_DIR}
        target: ${HOST_GIT_COMMON_DIR}
      - type: bind
        source: ${HOST_SECRETS_BUNDLE_DIR:-./.runtime/secrets}
        target: /secrets
        read_only: true
      - type: bind
        source: ${WAYLAND_SOCKET_PATH}
        target: /tmp/${WAYLAND_DISPLAY:-wayland-0}
      - type: bind
        source: ${HOST_OPENCODE_SHARE_DIR}
        target: /opencode-share
      - type: bind
        source: ${HOST_OPENCODE_CONFIG_DIR}
        target: /opencode-config
      - type: bind
        source: ${HOST_COMMON_HOME}/.emacs.d
        target: /home/${CONTAINER_USER:-dev}/.emacs.d
      - type: bind
        source: ${HOST_COMMON_HOME}/.bashrc
        target: /home/${CONTAINER_USER:-dev}/.bashrc
      - type: bind
        source: ${HOST_COMMON_HOME}/.bashrc.local
        target: /home/${CONTAINER_USER:-dev}/.bashrc.local
      - type: bind
        source: ${HOST_SSH_DIR}
        target: /home/${CONTAINER_USER:-dev}/.ssh
        read_only: true
      - type: bind
        source: ${HOST_NPM_CACHE_DIR}
        target: /cache/npm
      - type: bind
        source: ${HOST_PNPM_STORE_DIR}
        target: /cache/pnpm-store
      - type: bind
        source: ${HOST_PNPM_HOME_DIR}
        target: /cache/pnpm
      - type: bind
        source: ${HOST_PIP_CACHE_DIR}
        target: /cache/pip
      - type: bind
        source: ${HOST_CACHE_DIR}
        target: /home/${CONTAINER_USER:-dev}/.cache
